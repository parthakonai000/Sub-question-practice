<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PK Practice – মাধ্যমিক প্রশ্ন প্র্যাকটিস</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("pk-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="logo">PK</span>PK Practice</div>
    <button id="themeBtn" class="icon-btn" aria-label="থিম বদলাও">
      <svg class="sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <main>
    <!-- হোম -->
    <section id="home" class="view active">
      <div class="hero">
        <span class="logo xl">PK</span>
        <h1>PK Practice</h1>
        <p class="bn">মাধ্যমিকের প্রশ্ন, প্রতিদিন একটু একটু করে।</p>
      </div>
      <div class="menu">
        <button class="opt" data-go="setup">
          <span class="opt-ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span>
          <span class="opt-txt"><b>প্র্যাকটিস</b><small>নিজে ১০টি প্রশ্ন সমাধান করো</small></span>
          <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
        </button>
        <a class="opt" href="question practice/friends.html">
          <span class="opt-ico opp"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg></span>
          <span class="opt-txt"><b>Play with Friends</b><small>বন্ধুদের সাথে একসাথে খেলো</small></span>
          <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
        </a>
      </div>
    </section>

    <!-- বিষয় বাছাই -->
    <section id="setup" class="view">
      <button class="back" data-go="home">← হোম</button>
      <div class="card form-card">
        <div>
          <h2 class="card-title">কোন বিষয়ে প্র্যাকটিস করবে?</h2>
          <p class="sub">বিষয় বেছে নিলে ১০টি র‍্যান্ডম প্রশ্ন আসবে।</p>
        </div>
        <div id="subjects" class="grid"><p class="sub">প্রশ্ন লোড হচ্ছে…</p></div>
        <p id="setupError" class="error" hidden></p>
      </div>
      <button id="startBtn" class="btn primary" disabled>বিষয় বাছাই করো</button>
    </section>

    <!-- কুইজ -->
    <section id="quiz" class="view">
      <div class="q-meta">
        <button id="quitBtn" class="leave">✕ বন্ধ করো</button>
        <span id="counter" class="count"></span>
      </div>
      <div id="segs" class="segs"></div>
      <div id="qCard" class="card q-card">
        <span id="qSubject" class="tag"></span>
        <h2 id="qText" class="q-text"></h2>
        <div id="options" class="options"></div>
        <div id="feedback" class="feedback" hidden></div>
      </div>
      <button id="nextBtn" class="btn primary" hidden>পরবর্তী</button>
    </section>

    <!-- রেজাল্ট -->
    <section id="result" class="view">
      <div class="card result-card">
        <div id="ring" class="ring">
          <svg viewBox="0 0 120 120"><circle class="trk" cx="60" cy="60" r="52"/><circle id="arc" class="arc" cx="60" cy="60" r="52"/></svg>
          <div class="ring-n"><b id="score"></b><small id="total"></small></div>
        </div>
        <h2 id="resultMsg"></h2>
        <p id="resultSub" class="reason"></p>
        <div class="stats">
          <div><b id="stOk"></b><span>সঠিক</span></div>
          <div><b id="stNo"></b><span>ভুল</span></div>
          <div><b id="stPct"></b><span>স্কোর</span></div>
        </div>
      </div>
      <details class="card review">
        <summary>প্রতিটি প্রশ্নের উত্তর দেখো</summary>
        <ul id="review"></ul>
      </details>
      <div class="row">
        <button id="againBtn" class="btn primary">আবার প্র্যাকটিস</button>
        <button class="btn ghost" data-go="home">হোম</button>
      </div>
    </section>
  </main>
</div>
<script src="script.js"></script>
</body>
</html>
